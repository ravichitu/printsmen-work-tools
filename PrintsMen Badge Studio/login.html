<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrintsMen | Sign In</title><link rel="stylesheet" href="activation.css"><script src="login.js" defer></script></head><body><main><header><span class="brand">PRINTSMEN / CUSTOMISED STUDIO</span></header><p class="eyebrow">OPERATOR ACCESS</p><h1>Sign in to your studio</h1><section class="panel"><form id="loginForm"><label id="usernameLabel" for="username">Email or username</label><input id="username" autocomplete="username" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button id="signin">Sign in</button></form><p id="message" role="status" aria-live="polite"></p></section><aside>Connected managed packages use Supabase operator accounts. Offline managed packages use their owner-created local operator login. Both still require an approved licence.</aside></main></body></html>
